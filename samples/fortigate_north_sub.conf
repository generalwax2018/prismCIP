#config-version=FG100F-7.4.4-FW-build2662-240514:opmode=0:vdom=0
config system global
    set hostname "HP-FGT-01"
end
config firewall policy
    edit 1
        set name "SCADA master to RTU"
        set uuid 1b2c3d4e-0000-0000-0000-000000000001
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "SCADA-Master"
        set dstaddr "NorthSub-RTU"
        set schedule "always"
        set service "DNP3-20000"
        set logtraffic all
        set comments "DNP3 polling from control center, CHG-1022"
    next
    edit 2
        set name "Vendor VPN to relays"
        set srcintf "ssl.root"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "NorthSub-Relays"
        set schedule "always"
        set service "HTTPS" "SSH"
        set groups "vendors"
        set logtraffic all
    next
    edit 3
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 4
        set name "old test rule"
        set status disable
        set srcintf "port1"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
    next
    edit 5
        set name "Deny rest"
        set srcintf "any"
        set dstintf "port3"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end
